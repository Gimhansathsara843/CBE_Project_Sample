# Spring Application Name
spring.application.name=materialdata

# Oracle Database Configuration
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=SPS
spring.datasource.password=spsdev
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate 6.x Dialect for Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.org.springframework.data.jpa=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicTypeDescriptor=TRACE

# Server Port
server.port=8082
